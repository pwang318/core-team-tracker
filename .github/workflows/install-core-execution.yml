name: Install CORE execution module
# Adds the two CORE module script tags to index.html without transferring the
# 1.7 MB file through a connector, then republishes GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/install-core-execution.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Include CORE module in the tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script defer src="./core/core-logic.js?v=20261126s"></script><script defer src="./core/core-app.js?v=20261126t"></script>'
          if tag not in s:
              if s.count('</body>') != 1:
                  raise SystemExit('Expected exactly one closing body tag')
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate before committing
        run: |
          node scripts/verify-tracker.cjs
          node scripts/test-core-logic.cjs
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load CORE execution module in LP tracker"
            git push
            gh workflow run publish-pages.yml --ref main
          fi
